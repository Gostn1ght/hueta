[package]
name = "packer"
version = "0.1.0"
edition = "2021"

[dependencies]
gamesync = { path = "../gamesync" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.13"
blake3 = "1"
hex = "0.4"
fastcdc = "3"
rayon = "1"
walkdir = "2"
globset = "0.4"
parking_lot = "0.12"
getrandom = "0.2"
ed25519-dalek = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
