[package]
name = "server"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "NetAnomalyServer"
path = "src/main.rs"

[dependencies]
gamesync = { path = "../gamesync" }
packer = { path = "../packer" }
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
hex = "0.4"
parking_lot = "0.12"
getrandom = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
