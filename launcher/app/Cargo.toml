[package]
name = "launcher"
version = "1.3.1"
edition = "2021"

[[bin]]
name = "Launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
gamesync = { path = "../crates/gamesync" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
parking_lot = "0.12"
blake3 = "1"
hex = "0.4"
base64 = "0.22"
rfd = "0.15"
winreg = "0.52"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Globalization", "Win32_Storage_FileSystem"] }
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }
