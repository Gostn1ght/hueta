name: Lost Zone DX11

on:
  push:
    branches: [menu-3d-hideout]
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/lostzone-world-backend.yml'
  workflow_dispatch:
    inputs:
      analyze:
        description: 'MSVC code analysis (PREfast) of the game instead of the build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lostzone-dx11-${{ github.ref }}-${{ inputs.analyze }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ !inputs.analyze }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check actual Lua menu and trade code
        run: |
          python -m pip install lupa==2.8 cryptography==46.0.2
          python scripts/check-netcoop-menu.py
          python scripts/check-netcoop-opaque-sights.py
          python scripts/check-netcoop-reload-input.py
          python scripts/check-netcoop-ambient.py
          python scripts/check-netcoop-task-offers.py
          python scripts/check-netcoop-trade.py
          python scripts/check-netcoop-trade-cache.py
          python scripts/check-netcoop-death-camera.py
          python scripts/check-netcoop-live-role-dialog.py
          python scripts/check-netcoop-inventory-compat.py
          python scripts/check-netcoop-inventory-capacity.py
          python scripts/check-netcoop-ai.py
          python scripts/check-netcoop-vision-cadence.py
          python scripts/check-netcoop-items.py
          python scripts/check-netcoop-loot-policy.py
          python scripts/check-netcoop-mines.py
          python scripts/check-lzpack.py
          python scripts/check-lzpack-release.py
          python scripts/check-gamma-exclusive-jobs.py
          python scripts/check-gamma-console-fixes.py
          python scripts/check-netcoop-world-rules.py
          python scripts/check-netcoop-sandbox.py
          python scripts/check-netcoop-traders.py
          python scripts/check-netcoop-box-contents.py
          python scripts/check-netcoop-distant-battles.py
          python scripts/check-netcoop-world-events.py
          python scripts/check-netcoop-respawn-state.py
          python scripts/check-netcoop-player-state.py
          python scripts/check-netcoop-full-map-plan.py
          python scripts/check-dist-windows-batch.py
          python scripts/check-netcoop-legacy-dialog.py
          python scripts/check-netcoop-pickup-fallback.py
          python scripts/check-netcoop-admin-commands.py
          python scripts/check-netcoop-actor-conditions.py
          python scripts/check-netcoop-server-hud.py
          python scripts/check-netcoop-transit.py
          python scripts/check-netcoop-lua-scope.py
          python scripts/check-netcoop-factions.py
          python scripts/check-netcoop-cluster-weather.py
          python scripts/check-netcoop-master-weather.py
          python scripts/check-netcoop-weather-edit.py
          python scripts/check-netcoop-map-known.py
          python scripts/check-netcoop-third-person.py
          python scripts/check-netcoop-rp-anims.py
          python scripts/check-netcoop-zones.py
          python scripts/check-netcoop-stash-fill.py
          python scripts/check-netcoop-dcp.py
          python scripts/check-netcoop-taskboard.py
          python scripts/check-netcoop-contracts.py
          python scripts/check-netcoop-ranks.py
          python scripts/check-netcoop-squads.py
          python scripts/check-netcoop-corpses.py
          python scripts/check-netcoop-pda.py
          python scripts/check-netcoop-pda-notifications.py
          python scripts/check-netcoop-emission.py
          python scripts/check-netcoop-psi-storm.py
          python scripts/check-netcoop-item-use.py
          python scripts/check-netcoop-mutant-loot.py
          python scripts/check-netcoop-pdanet.py
          python scripts/check-netcoop-pdanet-voice.py
          python scripts/check-netcoop-pdanet-photo.py
          python scripts/check-newway-pda-assets.py
          python scripts/check-netcoop-workshop.py
          python scripts/check-netcoop-npc-loot.py
          python scripts/check-netcoop-npc-gather.py
          python scripts/check-netcoop-backpack-anim.py
          python scripts/check-netcoop-move-speed.py
          python scripts/check-netcoop-weapon-parts.py
          python scripts/check-netcoop-loadout.py
          python scripts/check-netcoop-anims.py
          python scripts/check-netcoop-artefacts.py
          python scripts/check-netcoop-artefact-hunt.py
          python scripts/check-netcoop-master.py
          python scripts/check-netcoop-barter.py
          python scripts/check-netcoop-barter-client.py
          python scripts/check-netcoop-vehicles.py
          python scripts/check-netcoop-helicopter.py
          python scripts/check-vehicle-source-audit.py
          python scripts/check-netcoop-ground.py
          python scripts/check-netcoop-voice.py
          python scripts/check-ci-native-package.py
      - name: Check actual item interpolation
        run: python scripts/check-netcoop-physics.py
      - name: Check actual car closed-door spawn and physics state
        run: python scripts/check-native-car-lifecycle.py
      - name: Check actual detached item and replica teardown paths
        run: python scripts/check-native-detached-objects.py
      - name: Check texture memory recovery and dedicated input
        run: python scripts/check-native-texture-memory.py
      - name: Check actual startup menu audio
        run: python scripts/check-menu-audio.py
      - name: Check actual Firebase verification links
        run: python scripts/check-firebase-links.py
      - name: Check actual keyboard and clipboard paste
        run: python scripts/check-edit-input.py

  engine:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Check load harness and empty-server PDA before building
        shell: pwsh
        run: |
          ./scripts/check-netcoop-load-harness.ps1
          ./scripts/check-netcoop-host-controls.ps1
          ./scripts/check-netcoop-watchdog.ps1
          ./scripts/check-netcoop-master-arguments.ps1
          ./scripts/check-netcoop-launch-unblock.ps1
          python -m pip install lupa==2.8 cryptography==46.0.2
          python scripts/check-netcoop-server-pda.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-netcoop-server-item-save.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check play32 combat, AI and PDA regressions
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set LZ_PLAY32_CHECKS_FAILED=0
          python scripts/check-native-play32-input-ai.py
          if errorlevel 1 set LZ_PLAY32_CHECKS_FAILED=1
          python scripts/check-native-melee-shot.py
          if errorlevel 1 set LZ_PLAY32_CHECKS_FAILED=1
          python scripts/check-native-perception-shot.py
          if errorlevel 1 set LZ_PLAY32_CHECKS_FAILED=1
          exit /b %LZ_PLAY32_CHECKS_FAILED%
      - name: Check Windows mail and clipboard API types
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python scripts/check-netcoop-scheduler.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-bot-gap.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-bot-target.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-windows-auth-api.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-transit-queue.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-player-transfer.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-account-store.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-session-ownership.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-commits.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-restore.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-physics-save.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-breakable-save.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-destroyable-save.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-failed-start-input.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-dialog-update.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-exit-log.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-hud-stop.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-console-capture.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-console-vector.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-spawn-visual.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-texture-list-lifetime.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-script-watchdog.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-background-shutdown.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-server-console.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-car-lights.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-car-suspension.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-helicopter.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-hud-light-projection.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-skeleton-motion-history.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-blast-ballistics.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-consumption-animation.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-level-changer-reject.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-trunk-reach.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-ui-resize.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-map-privacy.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-inventory-capacity.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-open-registration.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-rp-input.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-rp-motion.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-physics-replica.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-admin-god.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-admin-teleport.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-relation-null.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-environment-clock.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-bootstrap-clock.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-condition-clock.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-level-transition.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-physics-push.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-fragment-lifetime.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-mark-material.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-crow-enemy.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-monster-snapshot.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-host-stop.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-barrel-fuse.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-projectile-shot.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-voice-resources.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-pda-notifications.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-inventory-hands.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-pickup-admission.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-replica-relcase.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-task-clear.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-preview-pool.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-back-weapons.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-weapon-slot-tail.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-hud-state-authority.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-ammo-import.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-stamina-recovery.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-campfire.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-trade-policy.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-world-bridge.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-world-writer.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-admission.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-lzpack.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-weapon-menu.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-checksum.py
      - name: Check archived configurations and native entry routing
        # Archive-only configs must exercise the actual native resolver before
        # removing the old physical client directory from an update.
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python scripts/check-native-config-layout.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-entry-route.py
          if errorlevel 1 exit /b %errorlevel%
      - name: Check actor packet compatibility
        shell: pwsh
        run: ./scripts/check-actor-packet.ps1
      - name: Check item instance state model
        shell: pwsh
        run: ./scripts/check-item-state.ps1
      - name: Build voice codecs (Opus, SpeexDSP)
        shell: pwsh
        run: |
          $out = "src/3rd party/_voice_lib"
          New-Item -ItemType Directory -Force $out | Out-Null
          cmake -S "src/3rd party/opus" -B "_voice/opus" -A x64 -DOPUS_BUILD_PROGRAMS=OFF -DBUILD_TESTING=OFF -DOPUS_STACK_PROTECTOR=OFF -DOPUS_X86_MAY_HAVE_SSE=OFF -DOPUS_X86_MAY_HAVE_SSE2=OFF -DOPUS_X86_MAY_HAVE_SSE4_1=OFF -DOPUS_X86_MAY_HAVE_AVX=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          if ($LASTEXITCODE -ne 0) { throw "opus configure failed" }
          cmake --build "_voice/opus" --config Release --target opus
          if ($LASTEXITCODE -ne 0) { throw "opus build failed" }
          cmake -S "src/3rd party/speexdsp" -B "_voice/speexdsp" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE -ne 0) { throw "speexdsp configure failed" }
          cmake --build "_voice/speexdsp" --config Release
          if ($LASTEXITCODE -ne 0) { throw "speexdsp build failed" }
          Copy-Item "_voice/opus/Release/opus.lib", "_voice/speexdsp/Release/speexdsp.lib" $out
          Get-ChildItem $out
      - name: Inject archive key for protected game data
        shell: pwsh
        env:
          LZPACK_KEY_HEX: ${{ secrets.LZPACK_KEY_V1 }}
        run: python tools/lzpack/build_key_header.py
      - name: Build DX11 on GitHub Actions
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Build must run on GitHub Actions' }
          msbuild src/engine-vs2022.sln /m:2 /p:Configuration=DX11 /p:Platform=x64 /p:MultiProcessorCompilation=false /bl:lostzone-build.binlog /fl /flp:logfile=lostzone-build.log /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
      - name: Package matching client, server and overlays
        shell: pwsh
        run: |
          ./scripts/package-m1-dx11.ps1 -BuildBin ./_build/_game/bin_dbg -DestinationRoot ./lostzone-package
          Copy-Item -LiteralPath scripts/netcoop-overlay -Destination lostzone-package/overlay -Recurse
          Copy-Item -LiteralPath scripts/netcoop-cluster -Destination lostzone-package/hoster -Recurse
          Copy-Item -LiteralPath scripts/start-lostzone-cluster.cmd -Destination lostzone-package/1-Cluster.cmd
          New-Item -ItemType Directory -Path lostzone-package/notices -Force | Out-Null
          Copy-Item -LiteralPath scripts/fixtures/ixray-scheduler/LICENSE.md -Destination lostzone-package/notices/IX-Ray-LICENSE.md
          Copy-Item -LiteralPath scripts/start-lostzone-world.cmd -Destination lostzone-package/1-Server.cmd
          Copy-Item -LiteralPath 'scripts/dist/Start Master.cmd' -Destination 'lostzone-package/Start Master.cmd'
          Copy-Item -LiteralPath _build/_game/bin_dbg/LostZoneDX11.pdb -Destination lostzone-package/bin/LostZoneClientDX11.pdb
          Copy-Item -LiteralPath _build/_game/bin_dbg/LostZoneDX11.pdb -Destination lostzone-package/dedicated/LostZoneServerDX11.pdb
          Copy-Item -LiteralPath _build/lzpack-format.json -Destination lostzone-package/lzpack-format.json
          # The world master in the engine (owner 2026-10-19) keeps its world in SQLite.
          $prefix = python -c "import sys; print(sys.base_prefix)"
          Copy-Item -LiteralPath (Join-Path $prefix 'DLLs\sqlite3.dll') -Destination lostzone-package/dedicated/sqlite3.dll
          python scripts/check-portable-binaries.py lostzone-package
          if ($LASTEXITCODE -ne 0) { throw 'Portable PE dependency check failed' }
          Set-Content -LiteralPath lostzone-package/built-from.txt -Value $env:GITHUB_SHA
          Get-FileHash lostzone-package/bin/LostZoneClientDX11.exe,lostzone-package/dedicated/LostZoneServerDX11.exe | Format-List | Out-File lostzone-package/sha256.txt
      - name: Preserve verified runtime and symbols in a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-ci-native.py
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LostZone-DX11-client-server
          path: native-release/LostZone-native-runtime.zip
          retention-days: 2
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LostZone-DX11-build-log
          path: |
            lostzone-build.log
            lostzone-build.binlog
          if-no-files-found: ignore
          retention-days: 2
      # The second renderer the owner keeps (2026-10-20, doc 151): "DX8" = R1,
      # static lighting. Built after the DX11 package so a failure here never
      # holds the DX11 release; shared libraries are reused from the DX11 build.
      - name: Build DX8 (R1) client
        id: dx8
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild src/engine-vs2022.sln /m:2 /p:Configuration=DX8 /p:Platform=x64 /p:MultiProcessorCompilation=false /fl /flp:logfile=lostzone-dx8.log /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "DX8 MSBuild failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dx8-package/bin | Out-Null
          Copy-Item _build/_game/bin_dbg/LostZoneDX8.exe dx8-package/bin/LostZoneClientDX8.exe
          # Symbols for DX8 players' crash dumps and profiles.
          if (Test-Path _build/_game/bin_dbg/LostZoneDX8.pdb) { Copy-Item -LiteralPath _build/_game/bin_dbg/LostZoneDX8.pdb -Destination dx8-package/bin/LostZoneClientDX8.pdb }
          else { Write-Warning "LostZoneDX8.pdb was not produced" }
          Get-FileHash dx8-package/bin/LostZoneClientDX8.exe | Format-List | Out-File dx8-package/sha256.txt
      - uses: actions/upload-artifact@v4
        if: steps.dx8.outcome == 'success'
        continue-on-error: true
        with:
          name: LostZone-DX8-client
          path: dx8-package
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: LostZone-DX8-build-log
          path: lostzone-dx8.log
          if-no-files-found: ignore
          retention-days: 2

  analyze:
    if: ${{ inputs.analyze }}
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build voice codecs (Opus, SpeexDSP)
        shell: pwsh
        run: |
          $out = "src/3rd party/_voice_lib"
          New-Item -ItemType Directory -Force $out | Out-Null
          cmake -S "src/3rd party/opus" -B "_voice/opus" -A x64 -DOPUS_BUILD_PROGRAMS=OFF -DBUILD_TESTING=OFF -DOPUS_STACK_PROTECTOR=OFF -DOPUS_X86_MAY_HAVE_SSE=OFF -DOPUS_X86_MAY_HAVE_SSE2=OFF -DOPUS_X86_MAY_HAVE_SSE4_1=OFF -DOPUS_X86_MAY_HAVE_AVX=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          if ($LASTEXITCODE -ne 0) { throw "opus configure failed" }
          cmake --build "_voice/opus" --config Release --target opus
          if ($LASTEXITCODE -ne 0) { throw "opus build failed" }
          cmake -S "src/3rd party/speexdsp" -B "_voice/speexdsp" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE -ne 0) { throw "speexdsp configure failed" }
          cmake --build "_voice/speexdsp" --config Release
          if ($LASTEXITCODE -ne 0) { throw "speexdsp build failed" }
          Copy-Item "_voice/opus/Release/opus.lib", "_voice/speexdsp/Release/speexdsp.lib" $out
      - name: Inject archive key for protected game data
        shell: pwsh
        env:
          LZPACK_KEY_HEX: ${{ secrets.LZPACK_KEY_V1 }}
        run: python tools/lzpack/build_key_header.py
      - name: Analyze the game (PREfast)
        shell: pwsh
        run: |
          # Projects set their own compile options; cl.exe appends _CL_ to every call.
          $env:_CL_ = '/analyze'
          msbuild src/engine-vs2022.sln /t:xrGame /m:2 /p:Configuration=DX11 /p:Platform=x64 /p:MultiProcessorCompilation=false /fl "/flp:logfile=analyze.log;verbosity=normal" /v:minimal
          "msbuild exit $LASTEXITCODE"
      - name: Report
        if: always()
        shell: pwsh
        run: python scripts/report-code-analysis.py analyze.log analyze-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LostZone-code-analysis
          path: |
            analyze-report.txt
            analyze.log
